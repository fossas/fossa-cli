# The only package is the workspace itself, installed as `conda: .`. It's the
# project, not a dependency, so an empty graph is the correct answer and must
# not trip the zero-dependency guard.
version: 6
environments:
  default:
    channels:
    - url: https://conda.anaconda.org/conda-forge/
    packages:
      linux-64:
      - conda: .
packages:
- conda: .
  name: my-data-package
  version: 0.1.0
  build: hbf21a9e_0
  subdir: noarch
  depends: []
