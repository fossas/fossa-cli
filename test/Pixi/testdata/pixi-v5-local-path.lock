# Trimmed from the Rattler v5 conda-lock fixture
# (conda/rattler test-data/conda-lock/v5/flat-index-lock.yml).
#
# The `requests` entry is the point: it is sourced from a local wheel via
# `path:` and carries no `url:`. Requiring `url:` made the whole file fail to
# parse with `key "url" not found`, so a project with one path-sourced package
# reported zero dependencies.
version: 5
environments:
  default:
    channels:
      - url: https://conda.anaconda.org/conda-forge/
    indexes:
      - https://pypi.org/simple
    find-links:
      - path: ./links
    packages:
      osx-arm64:
        - conda: https://conda.anaconda.org/conda-forge/osx-arm64/bzip2-1.0.8-h93a5062_5.conda
        - conda: https://conda.anaconda.org/conda-forge/noarch/tzdata-2024a-h0c530f3_0.conda
        - pypi: https://files.pythonhosted.org/packages/ba/06/a07f096c664aeb9f01624f858c3add0a4e913d6c96257acb4fce61e7de14/certifi-2024.2.2-py3-none-any.whl
        - pypi: https://files.pythonhosted.org/packages/e5/3e/741d8c82801c347547f8a2a06aa57dbb1992be9e948df2ea0eda2c8b79e8/idna-3.7-py3-none-any.whl
        - pypi: ./links/requests-2.31.0-py3-none-any.whl
