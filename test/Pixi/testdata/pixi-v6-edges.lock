# app links to libfoo and noarch tzdata; tzdata links back to linux-64 libfoo.
# libonlyosx is on another platform; missing-pkg is absent.
# cyc-a and cyc-b form a root cycle. The local gadget package requires widget.
version: 6
environments:
  default:
    channels:
      - url: https://conda.anaconda.org/conda-forge/
    packages:
      linux-64:
        - conda: https://conda.anaconda.org/conda-forge/linux-64/app-1.0-h0_0.conda
        - conda: https://conda.anaconda.org/conda-forge/linux-64/libfoo-1.2-h0_0.conda
        - conda: https://conda.anaconda.org/conda-forge/noarch/tzdata-2024a-h0_0.conda
        - conda: https://conda.anaconda.org/conda-forge/linux-64/cyc-a-1.0-h0_0.conda
        - conda: https://conda.anaconda.org/conda-forge/linux-64/cyc-b-1.0-h0_0.conda
        - pypi: ./libs/gadget
        - pypi: https://files.pythonhosted.org/packages/ab/cd/widget-1.0.0-py3-none-any.whl
        - pypi: https://files.pythonhosted.org/packages/ab/cd/zope_interface-6.0-py3-none-any.whl
        - pypi: https://files.pythonhosted.org/packages/ab/cd/charset_normalizer-3.3.2-py3-none-any.whl
        - pypi: https://files.pythonhosted.org/packages/ab/cd/guarded-0.1.0-py3-none-any.whl
      osx-arm64:
        - conda: https://conda.anaconda.org/conda-forge/osx-arm64/libonlyosx-1.0-h0_0.conda
packages:
  - conda: https://conda.anaconda.org/conda-forge/linux-64/app-1.0-h0_0.conda
    depends:
      - libfoo >=1.0
      - tzdata
      - libonlyosx >=1.0
      - missing-pkg >=2
    license: MIT
    size: 1
  - conda: https://conda.anaconda.org/conda-forge/linux-64/libfoo-1.2-h0_0.conda
    license: MIT
    size: 1
  - conda: https://conda.anaconda.org/conda-forge/noarch/tzdata-2024a-h0_0.conda
    depends:
      - libfoo
    license: LicenseRef-Public-Domain
    size: 1
  - conda: https://conda.anaconda.org/conda-forge/linux-64/cyc-a-1.0-h0_0.conda
    depends:
      - cyc-b
    license: MIT
    size: 1
  - conda: https://conda.anaconda.org/conda-forge/linux-64/cyc-b-1.0-h0_0.conda
    depends:
      - cyc-a
    license: MIT
    size: 1
  - conda: https://conda.anaconda.org/conda-forge/osx-arm64/libonlyosx-1.0-h0_0.conda
    license: MIT
    size: 1
  - pypi: ./libs/gadget
    name: gadget
    version: 0.2.0
    requires_dist:
      - widget
  - pypi: https://files.pythonhosted.org/packages/ab/cd/widget-1.0.0-py3-none-any.whl
    name: widget
    version: 1.0.0
    requires_dist:
      - zope.interface>=5
      - charset_normalizer
      - guarded; python_version < "3.9"
  - pypi: https://files.pythonhosted.org/packages/ab/cd/zope_interface-6.0-py3-none-any.whl
    name: zope-interface
    version: '6.0'
  - pypi: https://files.pythonhosted.org/packages/ab/cd/charset_normalizer-3.3.2-py3-none-any.whl
    name: charset-normalizer
    version: 3.3.2
  - pypi: https://files.pythonhosted.org/packages/ab/cd/guarded-0.1.0-py3-none-any.whl
    name: guarded
    version: 0.1.0
