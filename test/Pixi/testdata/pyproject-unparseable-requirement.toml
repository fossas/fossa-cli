# fossa's PEP 508 parser can't read the cffi and colorama requirements.
[project]
name = "example"
version = "0.1.0"
dependencies = [
    "rich>=13",
    "cffi>=1.15; python_implementation == 'CPython'",
]

[project.optional-dependencies]
windows = ["colorama; 'win' in sys_platform", "pywin32-ctypes>=0.2"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
pandas = ">=2.2"
