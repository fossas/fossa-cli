# Trimmed from snakemake/snakemake-executor-plugin-slurm v2.8.0, with its style
# feature written as a dependency group.
[project]
name = "snakemake-executor-plugin-slurm"
version = "2.8.0"
requires-python = ">=3.11,<4"
dependencies = [
    "snakemake-interface-common>=1.23.0,<2",
    "throttler>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
style = ["ruff>=0.10.0,<0.11"]
dev = [{include-group = "style"}]

[tool.ruff]
target-version = "py311"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
snakemake-executor-plugin-slurm = { path = "." }

[tool.pixi.environments]
quality = { features = ["style"] }
test = { features = ["test"] }

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=9.0.3,<10"
