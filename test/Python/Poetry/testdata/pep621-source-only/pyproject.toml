[project]
name = "my-pep621-source-only-project"
version = "1.0.0"
dependencies = [
    "requests>=2.28.0",
    "private-lib==2.0.10",
]

[tool.poetry.dependencies]
# Source-only entries; the version comes from [project].dependencies when present
private-lib = { source = "private" }
private-tool = { source = "private" }

[[tool.poetry.source]]
name = "private"
url = "https://pypi.example.com/simple"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
