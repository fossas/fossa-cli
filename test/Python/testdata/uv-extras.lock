version = 1
revision = 5
requires-python = ">=3.13"

[[package]]
name = "certifi"
version = "2026.10.23"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "cffi"
version = "2.1.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pycparser", marker = "implementation_name != 'PyPy'" },
]

[[package]]
name = "chardet"
version = "7.7.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "charset-normalizer"
version = "3.5.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "cryptography"
version = "50.0.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "cffi", marker = "platform_python_implementation != 'PyPy'" },
]

[[package]]
name = "extras"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "requests", extra = ["use-chardet-on-py3"] },
]

[package.dev-dependencies]
dev = [
    { name = "requests", extra = ["socks"] },
    { name = "requests-oauthlib", extra = ["rsa"] },
]

[package.metadata]
requires-dist = [{ name = "requests", extras = ["use-chardet-on-py3"] }]

[package.metadata.requires-dev]
dev = [
    { name = "requests", extras = ["socks"] },
    { name = "requests-oauthlib", extras = ["rsa"] },
]

[[package]]
name = "idna"
version = "3.20"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "oauthlib"
version = "4.0.1"
source = { registry = "https://pypi.org/simple" }

[package.optional-dependencies]
signedtoken = [
    { name = "cryptography" },
    { name = "pyjwt" },
]

[[package]]
name = "pycparser"
version = "3.12"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pyjwt"
version = "2.15.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pysocks"
version = "1.7.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "requests"
version = "2.34.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "charset-normalizer" },
    { name = "idna" },
    { name = "urllib3" },
]

[package.optional-dependencies]
socks = [
    { name = "pysocks" },
]
use-chardet-on-py3 = [
    { name = "chardet" },
]

[[package]]
name = "requests-oauthlib"
version = "2.0.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "oauthlib" },
    { name = "requests" },
]

[package.optional-dependencies]
rsa = [
    { name = "oauthlib", extra = ["signedtoken"] },
]

[[package]]
name = "urllib3"
version = "2.8.0"
source = { registry = "https://pypi.org/simple" }
