version = 1
revision = 5
requires-python = ">=3.13"

[[package]]
name = "certifi"
version = "2026.10.23"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "charset-normalizer"
version = "3.5.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "docutils"
version = "0.23"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "idna"
version = "3.20"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "iniconfig"
version = "2.3.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "jinja2"
version = "3.1.6"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "markupsafe" },
]

[[package]]
name = "markupsafe"
version = "3.0.4"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pygments"
version = "2.21.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "9.2.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "iniconfig" },
    { name = "pygments" },
]

[[package]]
name = "requests"
version = "2.34.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "charset-normalizer" },
    { name = "idna" },
    { name = "urllib3" },
]

[[package]]
name = "ruff"
version = "0.17.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "sphinx"
version = "9.2.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "docutils" },
    { name = "jinja2" },
    { name = "pygments" },
    { name = "requests" },
]

[[package]]
name = "urllib3"
version = "2.8.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "uv-groups"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "requests" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]
docs = [
    { name = "sphinx" },
]
lint = [
    { name = "ruff" },
]

[package.metadata]
requires-dist = [{ name = "requests" }]

[package.metadata.requires-dev]
dev = [{ name = "pytest" }]
docs = [{ name = "sphinx" }]
lint = [{ name = "ruff" }]
