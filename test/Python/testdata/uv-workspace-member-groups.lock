version = 1
revision = 5
requires-python = ">=3.13"

[manifest]
members = [
    "app",
    "lib",
]

[[package]]
name = "app"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "lib" },
]

[package.dev-dependencies]
dev = [
    { name = "iniconfig" },
]

[package.metadata]
requires-dist = [{ name = "lib", editable = "lib" }]

[package.metadata.requires-dev]
dev = [{ name = "iniconfig" }]

[[package]]
name = "idna"
version = "3.20"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "imagesize"
version = "2.0.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "iniconfig"
version = "2.3.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "lib"
version = "0.1.0"
source = { editable = "lib" }
dependencies = [
    { name = "idna" },
]

[package.dev-dependencies]
docs = [
    { name = "imagesize" },
]

[package.metadata]
requires-dist = [{ name = "idna" }]

[package.metadata.requires-dev]
docs = [{ name = "imagesize" }]
