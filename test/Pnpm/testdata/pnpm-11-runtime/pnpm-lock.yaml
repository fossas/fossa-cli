# pnpm 10.14+ with `devEngines.runtime` in package.json (`onFail: download`)
# pins the runtime in the lockfile: the root importer lists it under
# devDependencies with a `runtime:` specifier, and `packages` carries a
# `node@runtime:<version>` entry whose resolution is `type: variations` — one
# platform binary per variant, with no top-level `integrity` or `tarball`.
# The runtime is not a dependency of the project and must not be reported.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies:
      express:
        specifier: ^4.18.2
        version: 4.18.2
    devDependencies:
      node:
        specifier: runtime:24
        version: runtime:24.22.1

packages:
  body-parser@1.20.1:
    resolution: {integrity: sha512-xxxxxxxxxx==}

  express@4.18.2:
    resolution: {integrity: sha512-xxxxxxxxxx==}

  node@runtime:24.22.1:
    resolution:
      type: variations
      variants:
        - resolution:
            archive: tarball
            bin:
              node: bin/node
            integrity: sha256-9ONcExZd5ogMqiVYwKpIyoitpH/iI0vtB9Ztu4CkfI0=
            type: binary
            url: https://nodejs.org/download/release/v24.22.1/node-v24.22.1-linux-x64.tar.gz
          targets:
            - cpu: x64
              os: linux
        - resolution:
            archive: tarball
            bin:
              node: bin/node
            integrity: sha256-MjnqyC3Oz46zWh2LvcYxNmz2Ob5dSnBEeqq2j3jTBvA=
            type: binary
            url: https://nodejs.org/download/release/v24.22.1/node-v24.22.1-darwin-arm64.tar.gz
          targets:
            - cpu: arm64
              os: darwin
    version: 24.22.1

snapshots:
  body-parser@1.20.1: {}

  express@4.18.2:
    dependencies:
      body-parser: 1.20.1

  node@runtime:24.22.1: {}
