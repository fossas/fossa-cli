# pnpm v11+ writes a multi-document lockfile when a project uses config
# dependencies or a packageManager pin. The env lockfile (first document) is a
# structurally valid lockfile that declares the same lockfileVersion as the
# project lockfile, so a reader that keeps only the first document would report
# the env document and drop the project graph. This fixture exercises the union
# of both documents.
---
lockfileVersion: '9.0'

importers:
  .:
    configDependencies:
      pnpm-config-plugin: 1.0.0
    packageManagerDependencies:
      pnpm:
        specifier: 12.3.4
        version: 12.3.4

packages:
  # Config and package-manager dependencies exist ONLY in the env document.
  # They must be reported alongside the project graph, not dropped.
  pnpm-config-plugin@1.0.0:
    resolution: {integrity: sha256-envconfigintegrity==}

  pnpm@12.3.4:
    resolution: {integrity: sha512-aaaaaaaaaa==}

snapshots:
  pnpm-config-plugin@1.0.0: {}

  pnpm@12.3.4: {}
---
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true

importers:
  .:
    dependencies:
      local-pkg:
        specifier: file:packages/local-pkg
        version: file:packages/local-pkg

packages:
  file:packages/local-pkg:
    resolution: {directory: packages/local-pkg, type: directory}
    name: local-pkg

  express@4.18.2:
    resolution: {integrity: sha512-xxxxxxxxxx==}

  body-parser@1.20.1:
    resolution: {integrity: sha512-xxxxxxxxxx==}

snapshots:
  file:packages/local-pkg:
    dependencies:
      express: 4.18.2

  express@4.18.2:
    dependencies:
      body-parser: 1.20.1

  body-parser@1.20.1: {}
