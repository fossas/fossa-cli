lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

# A deeper workspace for exercising link following when scoping:
#   apps/web -> libs/ui -> libs/core -> libs/ui   (a chain that closes into a cycle)
#   apps/web -> libs/testkit                      (linked from devDependencies)
#   libs/testkit -> ../../vendor/not-a-member     (a link: to a path with no importer)
#   libs/orphan                                    (linked by nobody)

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.0.0
        version: 5.4.5

  apps/web:
    dependencies:
      '@ws/ui':
        specifier: workspace:*
        version: link:../../libs/ui
      left-pad:
        specifier: 1.3.0
        version: 1.3.0
    devDependencies:
      '@ws/testkit':
        specifier: workspace:*
        version: link:../../libs/testkit

  libs/core:
    dependencies:
      '@ws/ui':
        specifier: workspace:*
        version: link:../ui
      is-odd:
        specifier: 3.0.1
        version: 3.0.1

  libs/orphan:
    dependencies:
      lodash:
        specifier: ^4.17.21
        version: 4.17.21

  libs/testkit:
    dependencies:
      colorjs:
        specifier: ^0.1.9
        version: 0.1.9
      vendored:
        specifier: link:../../vendor/not-a-member
        version: link:../../vendor/not-a-member

  libs/ui:
    dependencies:
      '@ws/core':
        specifier: workspace:*
        version: link:../core
      uri-js:
        specifier: ^4.4.1
        version: 4.4.1

packages:

  colorjs@0.1.9:
    resolution: {integrity: sha512-filDwoNvVLqcLB4zMmWa65rgNHW/ff26wn3/q+XpYrI9EFts6fwnLIPYGOr8G+9cECMsxfCm9a2QzXdf+imY7A==}

  is-number@6.0.0:
